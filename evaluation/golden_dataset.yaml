cases:
  - id: lookup-001
    category: simple_lookup
    question: "What is the email address of customer Mary Smith?"
    gold_sql: "SELECT email FROM customer WHERE first_name = 'MARY' AND last_name = 'SMITH';"
    expected_rows: 1
    note: "customer MARY SMITH has email MARY.SMITH@sakilacustomer.org"
  - id: lookup-002
    category: simple_lookup
    question: "What is the title of the film with id 5?"
    gold_sql: "SELECT title FROM film WHERE film_id = 5;"
    expected_rows: 1
    note: "film id 5 is AFRICAN EGG"
  - id: lookup-003
    category: simple_lookup
    question: "What are the first and last names of the actor with id 1?"
    gold_sql: "SELECT first_name, last_name FROM actor WHERE actor_id = 1;"
    expected_rows: 1
    note: "actor id 1 is PENELOPE GUINESS"
  - id: lookup-004
    category: simple_lookup
    question: "What is the rental rate of the film 'Academy Dinosaur'?"
    gold_sql: "SELECT rental_rate FROM film WHERE title = 'ACADEMY DINOSAUR';"
    expected_rows: 1
    note: "film titles are stored uppercase"
  - id: lookup-005
    category: simple_lookup
    question: "What is the replacement cost of the film 'Ace Goldfinger'?"
    gold_sql: "SELECT replacement_cost FROM film WHERE title = 'ACE GOLDFINGER';"
    expected_rows: 1
    note: "film titles are stored uppercase"
  - id: lookup-006
    category: simple_lookup
    question: "What is the last name of the customer with id 100?"
    gold_sql: "SELECT last_name FROM customer WHERE customer_id = 100;"
    expected_rows: 1
    note: "customer id 100 last name is HAYES"
  - id: lookup-007
    category: simple_lookup
    question: "What is the name of the country with id 1?"
    gold_sql: "SELECT country FROM country WHERE country_id = 1;"
    expected_rows: 1
    note: "country id 1 is Afghanistan"
  - id: lookup-008
    category: simple_lookup
    question: "How many films are there in total?"
    gold_sql: "SELECT COUNT(*) FROM film;"
    expected_rows: 1
    note: "single-row count of all films"
  - id: lookup-009
    category: simple_lookup
    question: "What is the length of the film 'Airport Pollock'?"
    gold_sql: "SELECT length FROM film WHERE title = 'AIRPORT POLLOCK';"
    expected_rows: 1
    note: "film titles are stored uppercase"
  - id: lookup-010
    category: simple_lookup
    question: "What are all the distinct film ratings?"
    gold_sql: "SELECT DISTINCT rating FROM film ORDER BY rating;"
    expected_rows: 5
    note: "five ratings: G, PG, PG-13, R, NC-17"

  - id: join-001
    category: join
    question: "List the titles of all films in the 'Action' category."
    gold_sql: "SELECT f.title FROM film f JOIN film_category fc ON f.film_id = fc.film_id JOIN category c ON fc.category_id = c.category_id WHERE c.name = 'Action' ORDER BY f.title;"
    expected_rows: 64
    note: "64 films in Action category"
  - id: join-002
    category: join
    question: "List the full names of all actors in the film 'Academy Dinosaur'."
    gold_sql: "SELECT a.first_name, a.last_name FROM actor a JOIN film_actor fa ON a.actor_id = fa.actor_id JOIN film f ON f.film_id = fa.film_id WHERE f.title = 'ACADEMY DINOSAUR' ORDER BY a.last_name;"
    expected_rows: 10
    note: "10 actors in ACADEMY DINOSAUR"
  - id: join-003
    category: join
    question: "Which customers live in the country 'United States'?"
    gold_sql: "SELECT c.first_name, c.last_name FROM customer c JOIN address a ON c.address_id = a.address_id JOIN city ci ON a.city_id = ci.city_id JOIN country co ON ci.country_id = co.country_id WHERE co.country = 'United States' ORDER BY c.customer_id;"
    expected_rows: 36
    note: "36 customers in the United States"
  - id: join-004
    category: join
    question: "Which films has the actor 'Penelope Guiness' appeared in?"
    gold_sql: "SELECT f.title FROM film f JOIN film_actor fa ON f.film_id = fa.film_id JOIN actor a ON fa.actor_id = a.actor_id WHERE a.first_name = 'PENELOPE' AND a.last_name = 'GUINESS' ORDER BY f.title;"
    expected_rows: 19
    note: "PENELOPE GUINESS appears in 19 films"
  - id: join-005
    category: join
    question: "List each staff member and the store they work at."
    gold_sql: "SELECT s.first_name, s.last_name, st.store_id FROM staff s JOIN store st ON s.store_id = st.store_id ORDER BY s.staff_id;"
    expected_rows: 2
    note: "two staff members"
  - id: join-006
    category: join
    question: "Which films were rented by customer 'Mary Smith'?"
    gold_sql: "SELECT DISTINCT f.title FROM film f JOIN inventory i ON f.film_id = i.film_id JOIN rental r ON i.inventory_id = r.inventory_id JOIN customer c ON r.customer_id = c.customer_id WHERE c.first_name = 'MARY' AND c.last_name = 'SMITH' ORDER BY f.title;"
    expected_rows: 30
    note: "MARY SMITH rented 30 distinct films"
  - id: join-007
    category: join
    question: "What are the names of the cities where stores are located?"
    gold_sql: "SELECT ci.city FROM store s JOIN address a ON s.address_id = a.address_id JOIN city ci ON a.city_id = ci.city_id ORDER BY ci.city;"
    expected_rows: 2
    note: "two store cities"
  - id: join-008
    category: join
    question: "List film titles together with their language names."
    gold_sql: "SELECT f.title, l.name FROM film f JOIN language l ON f.language_id = l.language_id ORDER BY f.title;"
    expected_rows: 1000
    note: "all 1000 films are English"
  - id: join-009
    category: join
    question: "Which actors have appeared in films in the 'Comedy' category?"
    gold_sql: "SELECT DISTINCT a.first_name, a.last_name FROM actor a JOIN film_actor fa ON a.actor_id = fa.actor_id JOIN film_category fc ON fa.film_id = fc.film_id JOIN category c ON fc.category_id = c.category_id WHERE c.name = 'Comedy' ORDER BY a.last_name, a.first_name;"
    expected_rows: 147
    note: "147 distinct actors in Comedy films"
  - id: join-010
    category: join
    question: "Which customers rented films starring 'Nick Wahlberg'?"
    gold_sql: "SELECT DISTINCT c.first_name, c.last_name FROM customer c JOIN rental r ON c.customer_id = r.customer_id JOIN inventory i ON r.inventory_id = i.inventory_id JOIN film f ON i.film_id = f.film_id JOIN film_actor fa ON f.film_id = fa.film_id JOIN actor a ON fa.actor_id = a.actor_id WHERE a.first_name = 'NICK' AND a.last_name = 'WAHLBERG' ORDER BY c.last_name, c.first_name;"
    expected_rows: 288
    note: "288 distinct customers rented NICK WAHLBERG films"
  - id: join-011
    category: join
    question: "List the addresses of all stores."
    gold_sql: "SELECT a.address, a.district FROM store s JOIN address a ON s.address_id = a.address_id ORDER BY s.store_id;"
    expected_rows: 2
    note: "two store addresses"
  - id: join-012
    category: join
    question: "Which films are available in the inventory of store 1?"
    gold_sql: "SELECT DISTINCT f.title FROM film f JOIN inventory i ON f.film_id = i.film_id WHERE i.store_id = 1 ORDER BY f.title;"
    expected_rows: 759
    note: "759 distinct films in store 1 inventory"

  - id: agg-001
    category: aggregation
    question: "What is the total revenue across all payments?"
    gold_sql: "SELECT SUM(amount) FROM payment;"
    expected_rows: 1
    note: "single-row aggregation"
  - id: agg-002
    category: aggregation
    question: "How much revenue did store 2 generate?"
    gold_sql: "SELECT SUM(p.amount) FROM payment p JOIN staff s ON s.staff_id = p.staff_id WHERE s.store_id = 2;"
    expected_rows: 1
    note: "store revenue via payment -> staff -> store"
  - id: agg-003
    category: aggregation
    question: "How many rentals has customer 'Mary Smith' made?"
    gold_sql: "SELECT COUNT(*) FROM rental r JOIN customer c ON r.customer_id = c.customer_id WHERE c.first_name = 'MARY' AND c.last_name = 'SMITH';"
    expected_rows: 1
    note: "single-row count"
  - id: agg-004
    category: aggregation
    question: "What is the average rental rate of films in the 'Action' category?"
    gold_sql: "SELECT AVG(f.rental_rate) FROM film f JOIN film_category fc ON f.film_id = fc.film_id JOIN category c ON fc.category_id = c.category_id WHERE c.name = 'Action';"
    expected_rows: 1
    note: "single-row average"
  - id: agg-005
    category: aggregation
    question: "How many films are there in each category?"
    gold_sql: "SELECT c.name, COUNT(*) FROM category c JOIN film_category fc ON c.category_id = fc.category_id GROUP BY c.name ORDER BY c.name;"
    expected_rows: 16
    note: "one row per category"
  - id: agg-006
    category: aggregation
    question: "Which actor has appeared in the most films?"
    gold_sql: "SELECT a.first_name, a.last_name FROM actor a JOIN film_actor fa ON a.actor_id = fa.actor_id GROUP BY a.actor_id, a.first_name, a.last_name ORDER BY COUNT(*) DESC LIMIT 1;"
    expected_rows: 1
    note: "GINA DEGENERES with 42 films"
  - id: agg-007
    category: aggregation
    question: "What is the total replacement cost of all films?"
    gold_sql: "SELECT SUM(replacement_cost) FROM film;"
    expected_rows: 1
    note: "single-row aggregation"
  - id: agg-008
    category: aggregation
    question: "How many distinct customers made at least one payment?"
    gold_sql: "SELECT COUNT(DISTINCT customer_id) FROM payment;"
    expected_rows: 1
    note: "single-row count"
  - id: agg-009
    category: aggregation
    question: "List the top 5 customers by total spending."
    gold_sql: "SELECT c.first_name, c.last_name, SUM(p.amount) AS total FROM customer c JOIN payment p ON c.customer_id = p.customer_id GROUP BY c.customer_id, c.first_name, c.last_name ORDER BY total DESC LIMIT 5;"
    expected_rows: 5
    note: "top 5 by total spend"
  - id: agg-010
    category: aggregation
    question: "What is the average film length for each rating?"
    gold_sql: "SELECT rating, AVG(length) FROM film GROUP BY rating ORDER BY rating;"
    expected_rows: 5
    note: "one row per rating"
  - id: agg-011
    category: aggregation
    question: "Which store has the most rentals?"
    gold_sql: "SELECT i.store_id FROM rental r JOIN inventory i ON r.inventory_id = i.inventory_id GROUP BY i.store_id ORDER BY COUNT(*) DESC LIMIT 1;"
    expected_rows: 1
    note: "store 2 with 8121 rentals"
  - id: agg-012
    category: aggregation
    question: "How many actors appear in the average film?"
    gold_sql: "SELECT AVG(cnt) FROM (SELECT COUNT(*) AS cnt FROM film_actor GROUP BY film_id) sub;"
    expected_rows: 1
    note: "average actors per film"

  - id: date-001
    category: date_filter
    question: "How many rentals occurred in May 2005?"
    gold_sql: "SELECT COUNT(*) FROM rental WHERE rental_date >= '2005-05-01' AND rental_date < '2005-06-01';"
    expected_rows: 1
    note: "single-row count"
  - id: date-002
    category: date_filter
    question: "List all payments made on or after 2006-01-01."
    gold_sql: "SELECT payment_id, customer_id, staff_id, amount, payment_date FROM payment WHERE payment_date >= '2006-01-01' ORDER BY payment_date;"
    expected_rows: 16049
    note: "all payments are dated 2017, so every payment matches"
  - id: date-003
    category: date_filter
    question: "Which films were released between 2005 and 2006?"
    gold_sql: "SELECT title FROM film WHERE release_year BETWEEN 2005 AND 2006 ORDER BY title;"
    expected_rows: 1000
    note: "all films have release_year 2006"
  - id: date-004
    category: date_filter
    question: "How much revenue was collected in June 2005?"
    gold_sql: "SELECT SUM(amount) FROM payment WHERE payment_date >= '2005-06-01' AND payment_date < '2005-07-01';"
    expected_rows: 1
    note: "payments are dated 2017; no June 2005 payments exist, so this returns NULL (zero revenue)"
  - id: date-005
    category: date_filter
    question: "Which customers rented films during the last week of May 2005?"
    gold_sql: "SELECT DISTINCT c.first_name, c.last_name FROM customer c JOIN rental r ON c.customer_id = r.customer_id WHERE r.rental_date >= '2005-05-25' AND r.rental_date < '2005-06-01' ORDER BY c.last_name, c.first_name;"
    expected_rows: 517
    note: "last week of May 2005 = May 25 through May 31"
  - id: date-006
    category: date_filter
    question: "List films released in the year 2006."
    gold_sql: "SELECT title FROM film WHERE release_year = 2006 ORDER BY title;"
    expected_rows: 1000
    note: "all films released in 2006"
  - id: date-007
    category: date_filter
    question: "How many payments were made in March 2006?"
    gold_sql: "SELECT COUNT(*) FROM payment WHERE payment_date >= '2006-03-01' AND payment_date < '2006-04-01';"
    expected_rows: 1
    note: "payments are dated 2017; no March 2006 payments exist, so this returns 0"
  - id: date-008
    category: date_filter
    question: "Which rentals started between 2005-07-01 and 2005-07-31?"
    gold_sql: "SELECT rental_id, rental_date, customer_id FROM rental WHERE rental_date >= '2005-07-01' AND rental_date < '2005-08-01' ORDER BY rental_date;"
    expected_rows: 6790
    note: "6790 rentals in July 2005"

  - id: amb-001
    category: ambiguous
    question: "What are the top films?"
    gold_sql:
      - "SELECT f.title FROM film f JOIN inventory i ON f.film_id = i.film_id JOIN rental r ON i.inventory_id = r.inventory_id GROUP BY f.film_id, f.title ORDER BY COUNT(*) DESC LIMIT 5;"
      - "SELECT f.title FROM film f JOIN inventory i ON f.film_id = i.film_id JOIN rental r ON i.inventory_id = r.inventory_id JOIN payment p ON r.rental_id = p.rental_id GROUP BY f.film_id, f.title ORDER BY SUM(p.amount) DESC LIMIT 5;"
    note: "'top' is ambiguous: by rental count vs by revenue"
  - id: amb-002
    category: ambiguous
    question: "Who are the best customers?"
    gold_sql:
      - "SELECT c.first_name, c.last_name FROM customer c JOIN payment p ON c.customer_id = p.customer_id GROUP BY c.customer_id, c.first_name, c.last_name ORDER BY SUM(p.amount) DESC LIMIT 5;"
      - "SELECT c.first_name, c.last_name FROM customer c JOIN rental r ON c.customer_id = r.customer_id GROUP BY c.customer_id, c.first_name, c.last_name ORDER BY COUNT(*) DESC LIMIT 5;"
    note: "'best' is ambiguous: by total spending vs by number of rentals"
  - id: amb-003
    category: ambiguous
    question: "Which is the most popular film?"
    gold_sql:
      - "SELECT f.title FROM film f JOIN inventory i ON f.film_id = i.film_id JOIN rental r ON i.inventory_id = r.inventory_id GROUP BY f.film_id, f.title ORDER BY COUNT(*) DESC LIMIT 1;"
      - "SELECT f.title FROM film f JOIN inventory i ON f.film_id = i.film_id JOIN rental r ON i.inventory_id = r.inventory_id GROUP BY f.film_id, f.title ORDER BY COUNT(DISTINCT r.customer_id) DESC LIMIT 1;"
    note: "'popular' is ambiguous: most rentals vs most distinct renters"
  - id: amb-004
    category: ambiguous
    question: "How much did we make recently?"
    gold_sql:
      - "SELECT SUM(amount) FROM payment WHERE payment_date >= '2017-05-07';"
      - "SELECT SUM(amount) FROM payment WHERE payment_date >= '2017-04-14';"
    note: "'recently' is ambiguous: last 7 days vs last 30 days (anchored to latest payment 2017-05-14)"
  - id: amb-005
    category: ambiguous
    question: "Show me the biggest store."
    gold_sql:
      - "SELECT i.store_id FROM inventory i GROUP BY i.store_id ORDER BY COUNT(*) DESC LIMIT 1;"
      - "SELECT s.store_id FROM payment p JOIN staff s ON p.staff_id = s.staff_id GROUP BY s.store_id ORDER BY SUM(p.amount) DESC LIMIT 1;"
    note: "'biggest' is ambiguous: most inventory vs most revenue"
  - id: amb-006
    category: ambiguous
    question: "What is the latest movie?"
    gold_sql:
      - "SELECT title FROM film ORDER BY film_id DESC LIMIT 1;"
      - "SELECT DISTINCT f.title FROM film f JOIN inventory i ON f.film_id = i.film_id JOIN rental r ON i.inventory_id = r.inventory_id WHERE r.rental_date = (SELECT MAX(rental_date) FROM rental) ORDER BY f.title;"
    note: "'latest' is ambiguous: last added to catalog (highest film_id) vs most recently rented"

  - id: una-001
    category: unanswerable
    question: "What is the email of the employee who manages the inventory system?"
    note: "no 'employee' table exists (only 'staff'), and no inventory-system manager concept in the schema"
  - id: una-002
    category: unanswerable
    question: "List all products in the 'electronics' category."
    note: "no 'product' table or 'electronics' category exists; the catalog contains films, not products"
  - id: una-003
    category: unanswerable
    question: "What is the total order value for 2024?"
    note: "no 'order' table exists; only payments, and none are dated 2024"
  - id: una-004
    category: unanswerable
    question: "Which suppliers shipped to store 1 in July?"
    note: "no 'supplier' or 'shipment' table exists in the schema"
  - id: una-005
    category: unanswerable
    question: "What is the budget of the film 'Academy Dinosaur'?"
    note: "the film table has no 'budget' column"
  - id: una-006
    category: unanswerable
    question: "How many subscribers do we have?"
    note: "no 'subscriber' table exists; the closest concept is 'customer', which is not a subscription"
