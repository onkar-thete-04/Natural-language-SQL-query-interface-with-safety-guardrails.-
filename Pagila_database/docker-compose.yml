version: "3"
volumes:
  pgdata:
services:
  pagila:
    image: postgres:13.2
    container_name: pagila
    environment:
      POSTGRES_PASSWORD: 123456
      POSTGRES_USER: postgres
      POSTGRES_DB: pagila  
    volumes:
      - ./01_pagila_schema.sql:/docker-entrypoint-initdb.d/01_pagila_schema.sql
      - ./02_pagila_data.sql:/docker-entrypoint-initdb.d/02_pagila_data.sql
      - pgdata:/var/lib/postgresql/data
    expose:
      - 5432
    ports:
      - 5432:5432
  pgadmin:
    container_name: pgadmin4_container
    image: dpage/pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: root
    ports:
      - "5050:80"
